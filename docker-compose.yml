services:
  nats:
    image: nats:2.14.1-linux
    container_name: nats
    restart: unless-stopped
    ports:
      # Клиентский порт NATS: сюда подключаются приложения (publish/subscribe).
      - "4222:4222"

      # HTTP-порт мониторинга NATS (healthz/varz/jsz/connz/routez).
      - "8222:8222"
      
    volumes:
      # Каталог данных JetStream на хосте.
      # Внутри контейнера всегда монтируется в /data/jetstream.
      - "/home/user/apps/nats-data/jetstream:/data/jetstream"

      # Конфиг NATS из репозитория (только чтение).
      - "./config/nats.conf:/etc/nats/nats.conf:ro"

    command: ["-c", "/etc/nats/nats.conf"]
    
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
